services:
  # The Web Service (Django ASGI/Channels via Daphne) - 100% Free Forever Tier
  - type: web
    name: recruiter-pro-web
    env: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AI_PROVIDER
        value: "huggingface"
      # Set DATABASE_URL in Render Dashboard using a free forever DB like Neon.tech or Supabase
